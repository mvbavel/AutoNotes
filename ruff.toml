# Lint run by CI (.github/workflows/build.yml) and locally with `ruff check`.
target-version = "py314"
line-length = 100
extend-exclude = [".agents", ".claude", "build", "dist"]

[lint]
# Real errors and likely bugs, plus security checks — not style.
select = ["E9", "F", "B", "PLE", "S", "RUF006", "RUF012"]
ignore = [
    "S101",  # assert: used in tests
    "S110",  # try/except/pass: deliberate where a failure is non-fatal (each is commented)
    "S603",  # subprocess with a list argv and no shell is the safe form
    "S607",  # `open`/`codesign` are resolved on PATH by design
    "B904",  # raise ... from: tracebacks are logged in full anyway
]

[lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
