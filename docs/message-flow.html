<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNotes · Message Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #2e404d;
      --color-muted:   #4a5b68;
      --color-accent:  #0072bc;
      --font-sans:     'Noto Sans', system-ui, sans-serif;
      --font-serif:    'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width; the wrapper scrolls on narrow screens instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper can't scroll, so let the diagram shrink to the sheet rather than clip. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · AutoNotes</p>
    <h1>One run, message by message</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="message-flow-title message-flow-desc">
        <title id="message-flow-title">One run, message by message</title>
        <desc id="message-flow-desc">Sequence of one AutoNotes run: the user starts processing, the main window starts the worker thread, the worker downloads the video, runs local stages, asks the Claude API for notes, writes the DOCX, and reports completed or error back to the window through Qt signals.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(46,64,77,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5b68"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0072bc"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#005b96"/></marker>
          <!-- Hollow head marks fire-and-forget Qt signals -->
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4a5b68" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ============ Lifelines: User 104 · Window 288 · Worker 472 · Video 656 · Claude 840 ============ -->
        <line x1="104" y1="120" x2="104" y2="752" stroke="rgba(46,64,77,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="288" y1="120" x2="288" y2="752" stroke="rgba(46,64,77,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="472" y1="120" x2="472" y2="752" stroke="rgba(46,64,77,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="656" y1="120" x2="656" y2="752" stroke="rgba(46,64,77,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="120" x2="840" y2="752" stroke="rgba(46,64,77,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ ALT fragment: how the run ends (Window · Worker only) ============ -->
        <rect x="232" y="552" width="296" height="144" rx="4" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.22)" stroke-width="1"/>
        <rect x="232" y="552" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(46,64,77,0.22)" stroke-width="1"/>
        <text x="252" y="564" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="244" y="584" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[success]</text>
        <line x1="240" y1="632" x2="520" y2="632" stroke="rgba(46,64,77,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="244" y="652" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[exception]</text>

        <!-- ============ Activation bars ============ -->
        <rect x="284" y="152" width="8" height="56" fill="rgba(46,64,77,0.06)" stroke="#4a5b68" stroke-width="0.8"/>
        <!-- Worker holds control for the whole run -->
        <rect x="468" y="196" width="8" height="536" fill="rgba(46,64,77,0.06)" stroke="#4a5b68" stroke-width="0.8"/>
        <rect x="652" y="284" width="8" height="48" fill="rgba(46,64,77,0.06)" stroke="#4a5b68" stroke-width="0.8"/>
        <rect x="836" y="420" width="8" height="48" fill="rgba(46,64,77,0.06)" stroke="#4a5b68" stroke-width="0.8"/>

        <!-- ============ Messages ============ -->
        <!-- M1 User → Window: click Process -->
        <line x1="104" y1="160" x2="284" y2="160" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="170" y="140" width="52" height="12" rx="2" fill="#ffffff"/>
        <text x="196" y="149" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROCESS</text>

        <!-- M2 Window → Worker: QThread.start() returns at once -->
        <line x1="292" y1="200" x2="468" y2="200" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="354" y="180" width="52" height="12" rx="2" fill="#ffffff"/>
        <text x="380" y="189" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START()</text>

        <!-- M3 Worker → Window: stage_changed / stage_progress / stage_detail / log_message -->
        <line x1="468" y1="240" x2="288" y2="240" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="336" y="220" width="88" height="12" rx="2" fill="#ffffff"/>
        <text x="380" y="229" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE SIGNALS</text>

        <!-- M4 Worker → Video host: yt-dlp download -->
        <line x1="476" y1="288" x2="652" y2="288" stroke="#005b96" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="524" y="268" width="80" height="12" rx="2" fill="#ffffff"/>
        <text x="564" y="277" fill="#005b96" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YT-DLP FETCH</text>

        <!-- M5 Video host → Worker: video file + any VTT/Stream transcript -->
        <line x1="652" y1="328" x2="476" y2="328" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="524" y="308" width="80" height="12" rx="2" fill="#ffffff"/>
        <text x="564" y="317" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIDEO + SUBS</text>

        <!-- M6 Worker self: audio, Whisper, diarization, frames (all local) -->
        <path d="M 476,360 H 504 Q 512,360 512,368 V 376 Q 512,384 504,384 H 476" fill="none" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="520" y="366" width="80" height="12" rx="2" fill="#ffffff"/>
        <text x="560" y="375" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGES 02–05</text>

        <!-- M7 Worker → Claude API (label kept clear of the Video host lifeline) -->
        <line x1="476" y1="424" x2="836" y2="424" stroke="#005b96" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="708" y="404" width="80" height="12" rx="2" fill="#ffffff"/>
        <text x="748" y="413" fill="#005b96" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEXT + JPEGS</text>

        <!-- M8 Claude API → Worker -->
        <line x1="836" y1="464" x2="476" y2="464" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="714" y="444" width="68" height="12" rx="2" fill="#ffffff"/>
        <text x="748" y="453" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTES JSON</text>

        <!-- M9 Worker self: stage 07 -->
        <path d="M 476,496 H 504 Q 512,496 512,504 V 512 Q 512,520 504,520 H 476" fill="none" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="520" y="502" width="68" height="12" rx="2" fill="#ffffff"/>
        <text x="554" y="511" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE DOCX</text>

        <!-- M10 Worker → Window: completed(path) — headline -->
        <line x1="468" y1="608" x2="288" y2="608" stroke="#0072bc" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="348" y="588" width="64" height="12" rx="2" fill="#ffffff"/>
        <text x="380" y="597" fill="#0072bc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPLETED</text>

        <!-- M11 Worker → Window: error(msg); suppressed when the run was cancelled -->
        <line x1="468" y1="676" x2="288" y2="676" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="346" y="656" width="68" height="12" rx="2" fill="#ffffff"/>
        <text x="380" y="665" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERROR(MSG)</text>

        <!-- M12 Worker → Window: QThread.finished, always — resets the UI -->
        <line x1="468" y1="728" x2="288" y2="728" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="352" y="708" width="56" height="12" rx="2" fill="#ffffff"/>
        <text x="380" y="717" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINISHED</text>

        <!-- ============ Actor boxes (after arrows) ============ -->
        <!-- User (input) -->
        <rect x="36" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="36" y="64" width="136" height="56" rx="6" fill="rgba(74,91,104,0.10)" stroke="#5e6e7a" stroke-width="1"/>
        <rect x="44" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(94,110,122,0.40)" stroke-width="0.8"/>
        <text x="62" y="81" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="104" y="96" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">User</text>
        <text x="104" y="111" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">URL or file</text>

        <!-- Main window (backend) -->
        <rect x="220" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="220" y="64" width="136" height="56" rx="6" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <rect x="228" y="72" width="24" height="12" rx="2" fill="transparent" stroke="rgba(46,64,77,0.40)" stroke-width="0.8"/>
        <text x="240" y="81" fill="#2e404d" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="288" y="96" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Main window</text>
        <text x="288" y="111" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">main thread</text>

        <!-- ProcessingWorker (focal) -->
        <rect x="404" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="404" y="64" width="136" height="56" rx="6" fill="rgba(0,114,188,0.08)" stroke="#0072bc" stroke-width="1"/>
        <rect x="412" y="72" width="52" height="12" rx="2" fill="transparent" stroke="rgba(0,114,188,0.50)" stroke-width="0.8"/>
        <text x="438" y="81" fill="#0072bc" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QTHREAD</text>
        <text x="472" y="96" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Worker</text>
        <text x="472" y="111" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ProcessingWorker</text>

        <!-- Video host (external) -->
        <rect x="588" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="588" y="64" width="136" height="56" rx="6" fill="rgba(46,64,77,0.03)" stroke="rgba(46,64,77,0.30)" stroke-width="1"/>
        <rect x="596" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(46,64,77,0.22)" stroke-width="0.8"/>
        <text x="610" y="81" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="656" y="96" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Video host</text>
        <text x="656" y="111" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">YouTube · MS 365</text>

        <!-- Claude API (external) -->
        <rect x="772" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="772" y="64" width="136" height="56" rx="6" fill="rgba(46,64,77,0.03)" stroke="rgba(46,64,77,0.30)" stroke-width="1"/>
        <rect x="780" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(46,64,77,0.22)" stroke-width="0.8"/>
        <text x="794" y="81" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="840" y="96" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Claude API</text>
        <text x="840" y="111" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-sonnet-5</text>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="776" x2="920" y2="776" stroke="rgba(46,64,77,0.12)" stroke-width="0.8"/>
        <text x="40" y="796" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="812" width="14" height="10" rx="2" fill="rgba(0,114,188,0.08)" stroke="#0072bc" stroke-width="1"/>
        <text x="60" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Focal actor</text>

        <rect x="140" y="808" width="28" height="18" rx="2" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.22)" stroke-width="1"/>
        <text x="146" y="820" fill="#4a5b68" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
        <text x="176" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Fragment</text>

        <line x1="256" y1="817" x2="284" y2="817" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="292" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Call</text>

        <line x1="348" y1="817" x2="376" y2="817" stroke="#005b96" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="384" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Network call</text>

        <line x1="480" y1="817" x2="508" y2="817" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="516" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Return</text>

        <line x1="584" y1="817" x2="612" y2="817" stroke="#4a5b68" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="620" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Qt signal (async)</text>

        <line x1="728" y1="817" x2="756" y2="817" stroke="#0072bc" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="764" y="820" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Headline result</text>
      </svg>
    </div>
  </div>
</body>
</html>
