<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNotes · Transcript Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #2e404d;
      --color-muted:   #4a5b68;
      --color-accent:  #0072bc;
      --font-sans:     'Noto Sans', system-ui, sans-serif;
      --font-serif:    'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width; the wrapper scrolls on narrow screens instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper can't scroll, so let the diagram shrink to the sheet rather than clip. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · AutoNotes</p>
    <h1>Where the transcript comes from</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
        <title id="flowchart-title">Where the transcript comes from</title>
        <desc id="flowchart-desc">Flowchart of how an AutoNotes run picks its transcript: a Teams transcript, then a reused saved transcript, then YouTube captions are used as-is if present; otherwise Whisper transcribes the audio and pyannote names speakers only when a Hugging Face token is set, before frames, notes and the DOCX.</desc>
        <defs>
          <pattern id="flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(46,64,77,0.10)"/>
          </pattern>
          <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5b68"/></marker>
          <marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0072bc"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#flow-dots)" opacity="0.55"/>

        <!-- ============ Arrows (behind nodes) ============ -->
        <!-- Main column x=320 -->
        <line x1="320" y1="80" x2="320" y2="104" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="184" x2="320" y2="208" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="288" x2="320" y2="312" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="392" x2="320" y2="416" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="464" x2="320" y2="488" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="568" x2="320" y2="592" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="640" x2="320" y2="668" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="320" y1="676" x2="320" y2="700" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>

        <!-- YES exits into "Use it as-is": top, left and bottom edges, one each -->
        <path d="M 424,144 H 632 Q 640,144 640,152 V 224" fill="none" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <line x1="424" y1="248" x2="560" y2="248" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <path d="M 424,352 H 632 Q 640,352 640,344 V 272" fill="none" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>

        <!-- Shortcut rejoins at the merge dot (right side) -->
        <path d="M 720,248 H 744 Q 752,248 752,256 V 664 Q 752,672 744,672 H 324" fill="none" stroke="#0072bc" stroke-width="1.4" marker-end="url(#flow-arrow-accent)"/>

        <!-- No HF token: diarize() falls back to one "Speaker" label (left side) -->
        <path d="M 216,528 H 168 Q 160,528 160,536 V 664 Q 160,672 168,672 H 316" fill="none" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>

        <!-- ============ Arrow labels ============ -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4a5b68">
          <rect x="328" y="190" width="24" height="12" rx="2" fill="#ffffff"/><text x="340" y="199">NO</text>
          <rect x="328" y="294" width="24" height="12" rx="2" fill="#ffffff"/><text x="340" y="303">NO</text>
          <rect x="328" y="398" width="24" height="12" rx="2" fill="#ffffff"/><text x="340" y="407">NO</text>
          <rect x="328" y="574" width="32" height="12" rx="2" fill="#ffffff"/><text x="344" y="583">YES</text>
          <rect x="476" y="124" width="32" height="12" rx="2" fill="#ffffff"/><text x="492" y="133">YES</text>
          <rect x="476" y="228" width="32" height="12" rx="2" fill="#ffffff"/><text x="492" y="237">YES</text>
          <rect x="476" y="332" width="32" height="12" rx="2" fill="#ffffff"/><text x="492" y="341">YES</text>
          <rect x="64" y="600" width="88" height="12" rx="2" fill="#ffffff"/><text x="108" y="609">NO · "SPEAKER"</text>
        </g>

        <!-- ============ Nodes ============ -->
        <!-- Start -->
        <rect x="240" y="32" width="160" height="48" rx="20" fill="rgba(46,64,77,0.03)" stroke="rgba(46,64,77,0.30)" stroke-width="1"/>
        <text x="320" y="54" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Video ready</text>
        <text x="320" y="70" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">after stage 01</text>

        <!-- D1 -->
        <polygon points="320,104 424,144 320,184 216,144" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="320" y="140" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Teams transcript</text>
        <text x="320" y="156" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">with the video?</text>

        <!-- D2 -->
        <polygon points="320,208 424,248 320,288 216,248" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="320" y="244" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Reuse ticked and</text>
        <text x="320" y="260" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">one is saved?</text>

        <!-- D3 -->
        <polygon points="320,312 424,352 320,392 216,352" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="320" y="348" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">YouTube captions</text>
        <text x="320" y="364" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">downloaded?</text>

        <!-- Whisper -->
        <rect x="240" y="416" width="160" height="48" rx="6" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="320" y="438" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Whisper on audio</text>
        <text x="320" y="454" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stages 02–03</text>

        <!-- D4 -->
        <polygon points="320,488 424,528 320,568 216,528" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="320" y="524" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Hugging Face</text>
        <text x="320" y="540" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">token set?</text>

        <!-- pyannote -->
        <rect x="240" y="592" width="160" height="48" rx="6" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="320" y="614" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Name speakers</text>
        <text x="320" y="630" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pyannote · stage 04</text>

        <!-- Use it as-is (focal shortcut) -->
        <rect x="560" y="224" width="160" height="48" rx="6" fill="rgba(0,114,188,0.08)" stroke="#0072bc" stroke-width="1"/>
        <text x="640" y="246" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Use it as-is</text>
        <text x="640" y="262" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skip stages 02–04</text>

        <!-- Merge -->
        <circle cx="320" cy="672" r="4" fill="#2e404d"/>

        <!-- End -->
        <rect x="220" y="700" width="200" height="48" rx="20" fill="rgba(46,64,77,0.03)" stroke="rgba(46,64,77,0.30)" stroke-width="1"/>
        <text x="320" y="722" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Frames, notes, DOCX</text>
        <text x="320" y="738" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stages 05–07</text>

        <!-- ============ Callout: the priority order is the non-obvious part ============ -->
        <path d="M 120 316 Q 176 296 212 252" fill="none" stroke="rgba(46,64,77,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="212" cy="252" r="2" fill="#2e404d"/>
        <text x="40" y="336" fill="#2e404d" font-size="14" font-style="italic" font-family="'Noto Serif', serif">Checked top to bottom:</text>
        <text x="40" y="354" fill="#2e404d" font-size="14" font-style="italic" font-family="'Noto Serif', serif">a reused transcript</text>
        <text x="40" y="372" fill="#2e404d" font-size="14" font-style="italic" font-family="'Noto Serif', serif">beats YouTube captions.</text>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="776" x2="920" y2="776" stroke="rgba(46,64,77,0.12)" stroke-width="0.8"/>
        <text x="40" y="796" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="812" width="24" height="12" rx="6" fill="rgba(46,64,77,0.03)" stroke="rgba(46,64,77,0.30)" stroke-width="1"/>
        <text x="72" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Start / end</text>

        <rect x="160" y="812" width="24" height="12" rx="2" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="192" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Step</text>

        <polygon points="248,818 260,812 272,818 260,824" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="280" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Decision</text>

        <circle cx="360" cy="818" r="4" fill="#2e404d"/>
        <text x="372" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Merge</text>

        <rect x="432" y="812" width="24" height="12" rx="2" fill="rgba(0,114,188,0.08)" stroke="#0072bc" stroke-width="1"/>
        <text x="464" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Transcript shortcut</text>

        <line x1="580" y1="818" x2="608" y2="818" stroke="#0072bc" stroke-width="1.4" marker-end="url(#flow-arrow-accent)"/>
        <text x="616" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Shortcut path</text>

        <line x1="712" y1="818" x2="740" y2="818" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
        <text x="748" y="822" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Branch</text>
      </svg>
    </div>
  </div>
</body>
</html>
