<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNotes · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #2e404d;
      --color-muted:   #4a5b68;
      --color-accent:  #0072bc;
      --font-sans:     'Noto Sans', system-ui, sans-serif;
      --font-serif:    'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width; the wrapper scrolls on narrow screens instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper can't scroll, so let the diagram shrink to the sheet rather than clip. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · AutoNotes</p>
    <h1>From recording to structured notes</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">From recording to structured notes</title>
        <desc id="architecture-desc">AutoNotes architecture: the PyQt6 main window starts a worker thread that downloads the video, transcribes it, picks screenshots, asks the Claude API for notes and writes a DOCX, reporting progress back through Qt signals.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(46,64,77,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5b68"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0072bc"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#005b96"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ============ Zones (behind arrows and nodes) ============ -->
        <!-- External services -->
        <rect x="248" y="56" width="688" height="112" rx="8" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.10)" stroke-width="0.8"/>
        <rect x="448" y="60" width="112" height="12" rx="2" fill="#ffffff"/>
        <text x="504" y="69" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL SERVICES</text>

        <!-- Main (GUI) thread -->
        <rect x="24" y="232" width="160" height="240" rx="8" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.10)" stroke-width="0.8"/>
        <rect x="68" y="236" width="72" height="12" rx="2" fill="#ffffff"/>
        <text x="104" y="245" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MAIN THREAD</text>

        <!-- Worker thread -->
        <rect x="248" y="232" width="688" height="240" rx="8" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.10)" stroke-width="0.8"/>
        <rect x="760" y="236" width="160" height="12" rx="2" fill="#ffffff"/>
        <text x="840" y="245" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROCESSINGWORKER · QTHREAD</text>

        <!-- ============ Arrows (before boxes) ============ -->
        <!-- UI starts the worker; worker reports back via Qt signals -->
        <line x1="168" y1="284" x2="264" y2="284" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 264,308 H 168" fill="none" stroke="#4a5b68" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- UI persists settings and secrets -->
        <line x1="104" y1="328" x2="104" y2="384" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Video hosts → Download -->
        <line x1="328" y1="152" x2="328" y2="264" stroke="#005b96" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Download → Transcribe -->
        <line x1="392" y1="296" x2="440" y2="296" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Download → Frames (bottom out, left in) -->
        <path d="M 328,328 V 408 Q 328,416 336,416 H 440" fill="none" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Transcribe → Frames: visual-cue phrases boost frame scores -->
        <line x1="504" y1="328" x2="504" y2="384" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Transcribe → Note generator -->
        <line x1="568" y1="296" x2="616" y2="296" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Frames → Note generator (right out, bottom in) -->

        <!-- Note generator ⇄ Claude API -->

        <path d="M 700,152 V 264" fill="none" stroke="#4a5b68" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <rect x="512" y="350" width="32" height="12" rx="2" fill="#ffffff"/>
        <text x="528" y="359" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CUES</text>

        <rect x="576" y="276" width="32" height="12" rx="2" fill="#ffffff"/>
        <text x="592" y="285" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEXT</text>

        <rect x="596" y="396" width="32" height="12" rx="2" fill="#ffffff"/>

        <text x="286" y="105" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="328" y="124" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Video hosts</text>
        <text x="328" y="140" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">YouTube · MS 365</text>

        <!-- Claude API (external) -->
        <rect x="616" y="88" width="128" height="64" rx="6" fill="#ffffff"/>
        <rect x="616" y="88" width="128" height="64" rx="6" fill="rgba(46,64,77,0.03)" stroke="rgba(46,64,77,0.30)" stroke-width="1"/>
        <rect x="624" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(46,64,77,0.22)" stroke-width="0.8"/>
        <text x="638" y="105" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="680" y="124" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Claude API</text>
        <text x="680" y="140" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-sonnet-5</text>

        <!-- Main window (input / UI) -->
        <rect x="40" y="264" width="128" height="64" rx="6" fill="#ffffff"/>
        <rect x="40" y="264" width="128" height="64" rx="6" fill="rgba(74,91,104,0.10)" stroke="#5e6e7a" stroke-width="1"/>
        <rect x="48" y="272" width="24" height="12" rx="2" fill="transparent" stroke="rgba(94,110,122,0.40)" stroke-width="0.8"/>
        <text x="60" y="281" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="104" y="300" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Main window</text>
        <text x="104" y="316" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PyQt6</text>

        <!-- Local state (store) -->

        <!-- 01 Download -->
        <rect x="264" y="264" width="128" height="64" rx="6" fill="#ffffff"/>

        <rect x="272" y="272" width="24" height="12" rx="2" fill="transparent" stroke="rgba(46,64,77,0.40)" stroke-width="0.8"/>

        <text x="328" y="316" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">yt-dlp · ffmpeg</text>

        <text x="504" y="300" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Transcribe</text>
        <text x="504" y="316" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whisper · pyannote</text>

        <!-- 05 Frames -->
        <rect x="440" y="384" width="128" height="64" rx="6" fill="#ffffff"/>
        <rect x="440" y="384" width="128" height="64" rx="6" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <rect x="448" y="392" width="24" height="12" rx="2" fill="transparent" stroke="rgba(46,64,77,0.40)" stroke-width="0.8"/>
        <text x="460" y="401" fill="#2e404d" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
        <text x="504" y="420" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif" text-anchor="middle">Frames</text>
        <text x="504" y="436" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ffmpeg · OpenCV</text>
