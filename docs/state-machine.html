<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNotes · Run States</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #2e404d;
      --color-muted:   #4a5b68;
      --color-accent:  #0072bc;
      --font-sans:     'Noto Sans', system-ui, sans-serif;
      --font-serif:    'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width; the wrapper scrolls on narrow screens instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper can't scroll, so let the diagram shrink to the sheet rather than clip. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · AutoNotes</p>
    <h1>The life of one run</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-machine-title state-machine-desc">
        <title id="state-machine-title">The life of one run</title>
        <desc id="state-machine-desc">Lifecycle of one AutoNotes run: Ready, Downloading, Analysing, Writing notes and Done on the primary rail; a Cancelling wait state; and Failed and Cancelled outcomes, all of which return the window to Ready when the worker thread finishes.</desc>
        <defs>
          <pattern id="state-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(46,64,77,0.10)"/>
          </pattern>
          <marker id="state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5b68"/></marker>
          <marker id="state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0072bc"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#state-dots)" opacity="0.55"/>

        <!-- ============ Bands and the running group ============ -->
        <text x="40" y="40" fill="#5e6e7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PRIMARY PHASES</text>

        <!-- One zone stands for "any running stage" so cancel and error are each a single transition -->
        <rect x="240" y="88" width="528" height="120" rx="8" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.10)" stroke-width="0.8"/>
        <rect x="252" y="92" width="128" height="12" rx="2" fill="#ffffff"/>
        <text x="316" y="101" fill="#5e6e7a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUNNING · WORKER THREAD</text>

        <rect x="24" y="248" width="912" height="112" rx="8" fill="rgba(74,91,104,0.035)" stroke="rgba(46,64,77,0.12)" stroke-width="0.8"/>
        <text x="40" y="268" fill="#5e6e7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WAIT</text>

        <rect x="24" y="400" width="912" height="112" rx="8" fill="rgba(46,64,77,0.035)" stroke="rgba(46,64,77,0.12)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#5e6e7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TERMINAL OUTCOMES</text>

        <!-- ============ Transitions (before states) ============ -->
        <!-- start → Ready -->
        <line x1="136" y1="70" x2="136" y2="120" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <!-- Rail -->
        <line x1="200" y1="156" x2="256" y2="156" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <line x1="384" y1="156" x2="440" y2="156" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <line x1="568" y1="156" x2="624" y2="156" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <line x1="752" y1="156" x2="808" y2="156" stroke="#0072bc" stroke-width="1.4" marker-end="url(#state-arrow-accent)"/>
        <!-- Running → Failed (exception, not cancelled) -->
        <line x1="504" y1="208" x2="504" y2="424" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <!-- Running → Cancelling -->
        <line x1="688" y1="208" x2="688" y2="272" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <!-- Cancelling → Cancelled -->
        <line x1="688" y1="344" x2="688" y2="424" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>

        <!-- ============ Transition labels ============ -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#4a5b68">
          <rect x="144" y="84" width="84" height="12" rx="2" fill="#ffffff"/><text x="186" y="93">[INPUT + KEY]</text>
          <rect x="204" y="136" width="48" height="12" rx="2" fill="#ffffff"/><text x="228" y="145">PROCESS</text>
          <rect x="394" y="136" width="36" height="12" rx="2" fill="#ffffff"/><text x="412" y="145">VIDEO</text>
          <rect x="574" y="136" width="44" height="12" rx="2" fill="#ffffff"/><text x="596" y="145">FRAMES</text>
          <rect x="762" y="136" width="36" height="12" rx="2" fill="#ffffff"/><text x="780" y="145" fill="#0072bc">SAVED</text>
          <rect x="512" y="224" width="60" height="12" rx="2" fill="#ffffff"/><text x="542" y="233">EXCEPTION</text>
          <rect x="696" y="224" width="44" height="12" rx="2" fill="#ffffff"/><text x="718" y="233">CANCEL</text>
          <rect x="696" y="372" width="84" height="12" rx="2" fill="#ffffff"/><text x="738" y="381">AT CHECKPOINT</text>
        </g>

        <!-- Start pseudo-state -->
        <circle cx="136" cy="64" r="6" fill="#2e404d"/>

        <!-- ============ Primary rail ============ -->
        <g font-family="'Noto Sans', sans-serif" text-anchor="middle">
          <g>
            <rect x="72" y="120" width="128" height="72" rx="8" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
            <text x="136" y="154" fill="#2e404d" font-size="12" font-weight="600">Ready</text>
            <text x="136" y="172" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">Process enabled</text>
          </g>
          <g>
            <rect x="256" y="120" width="128" height="72" rx="8" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
            <text x="320" y="154" fill="#2e404d" font-size="12" font-weight="600">Downloading</text>
            <text x="320" y="172" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">stage 01</text>
          </g>
          <g>
            <rect x="440" y="120" width="128" height="72" rx="8" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
            <text x="504" y="154" fill="#2e404d" font-size="12" font-weight="600">Analysing</text>
            <text x="504" y="172" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">stages 02–05</text>
          </g>
          <g>
            <rect x="624" y="120" width="128" height="72" rx="8" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
            <text x="688" y="154" fill="#2e404d" font-size="12" font-weight="600">Writing notes</text>
            <text x="688" y="172" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">stages 06–07</text>
          </g>
          <!-- Done: focal happy outcome, ringed end marker -->
          <g>
            <rect x="808" y="120" width="128" height="72" rx="8" fill="rgba(0,114,188,0.08)" stroke="#0072bc" stroke-width="1"/>
            <circle cx="828" cy="140" r="8" fill="none" stroke="#0072bc" stroke-width="1"/>
            <circle cx="828" cy="140" r="5" fill="#0072bc"/>
            <text x="872" y="154" fill="#2e404d" font-size="12" font-weight="600">Done</text>
            <text x="872" y="172" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">Open Document</text>
          </g>
        </g>

        <!-- ============ Wait state ============ -->
        <g text-anchor="middle">
          <rect x="624" y="272" width="128" height="72" rx="8" fill="#ffffff" stroke="#4a5b68" stroke-width="1" stroke-dasharray="5,4"/>
          <rect x="632" y="280" width="32" height="12" rx="2" fill="none" stroke="rgba(74,91,104,0.45)" stroke-width="0.8"/>
          <text x="648" y="289" fill="#4a5b68" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">WAIT</text>
          <text x="688" y="314" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif">Cancelling</text>
          <text x="688" y="332" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">finishing step</text>
        </g>

        <!-- ============ Terminal outcomes (differ by stroke style, not colour alone) ============ -->
        <g text-anchor="middle">
          <g>
            <rect x="440" y="424" width="128" height="72" rx="8" fill="rgba(46,64,77,0.04)" stroke="#4a5b68" stroke-width="1.5" stroke-dasharray="3,3"/>
            <rect x="448" y="432" width="56" height="12" rx="2" fill="none" stroke="rgba(74,91,104,0.45)" stroke-width="0.8"/>
            <text x="476" y="441" fill="#4a5b68" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TERMINAL</text>
            <text x="504" y="466" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif">Failed</text>
            <text x="504" y="484" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">error explained</text>
          </g>
          <g>
            <rect x="624" y="424" width="128" height="72" rx="8" fill="rgba(46,64,77,0.04)" stroke="#4a5b68" stroke-width="1"/>
            <rect x="632" y="432" width="56" height="12" rx="2" fill="none" stroke="rgba(74,91,104,0.45)" stroke-width="0.8"/>
            <text x="660" y="441" fill="#4a5b68" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TERMINAL</text>
            <text x="688" y="466" fill="#2e404d" font-size="12" font-weight="600" font-family="'Noto Sans', sans-serif">Cancelled</text>
            <text x="688" y="484" fill="#4a5b68" font-size="9" font-family="'Geist Mono', monospace">nothing saved</text>
          </g>
        </g>

        <!-- ============ Callout: the reset that would otherwise be three return arrows ============ -->
        <path d="M 120 440 Q 112 320 136 196" fill="none" stroke="rgba(46,64,77,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="136" cy="196" r="2" fill="#2e404d"/>
        <text x="48" y="460" fill="#2e404d" font-size="14" font-style="italic" font-family="'Noto Serif', serif">Every outcome returns to Ready</text>
        <text x="48" y="480" fill="#2e404d" font-size="14" font-style="italic" font-family="'Noto Serif', serif">once the worker thread finishes.</text>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(46,64,77,0.12)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4a5b68" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="45" cy="573" r="5" fill="#2e404d"/>
        <text x="56" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Start</text>

        <rect x="104" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2e404d" stroke-width="1"/>
        <text x="124" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Phase</text>

        <rect x="180" y="568" width="14" height="10" rx="2" fill="rgba(0,114,188,0.08)" stroke="#0072bc" stroke-width="1"/>
        <text x="200" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Success</text>

        <rect x="264" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#4a5b68" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="284" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Wait</text>

        <rect x="328" y="568" width="14" height="10" rx="2" fill="rgba(46,64,77,0.04)" stroke="#4a5b68" stroke-width="1"/>
        <text x="348" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Cancelled</text>

        <rect x="420" y="568" width="14" height="10" rx="2" fill="rgba(46,64,77,0.04)" stroke="#4a5b68" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="440" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Failed</text>

        <rect x="500" y="568" width="14" height="10" rx="2" fill="rgba(46,64,77,0.02)" stroke="rgba(46,64,77,0.10)" stroke-width="0.8"/>
        <text x="520" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Running group</text>

        <line x1="616" y1="573" x2="644" y2="573" stroke="#4a5b68" stroke-width="1.2" marker-end="url(#state-arrow)"/>
        <text x="652" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Transition</text>

        <line x1="728" y1="573" x2="756" y2="573" stroke="#0072bc" stroke-width="1.4" marker-end="url(#state-arrow-accent)"/>
        <text x="764" y="576" fill="#4a5b68" font-size="8.5" font-family="'Noto Sans', sans-serif">Happy path end</text>
      </svg>
    </div>
  </div>
</body>
</html>
