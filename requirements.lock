# Exact versions for release builds (CI's build.yml installs from this file).
#
# requirements.txt states what the code needs; this pins what ships, so a
# release can't change underneath a tag because something upstream published
# that morning (v1.6.6 broke in CI exactly that way). The monthly rebuild
# deliberately installs from requirements.txt instead, to catch rot early.
#
# Regenerate after changing requirements.txt, then run the tests:
#   python3.14 -m pip install --dry-run --ignore-installed --quiet \
#       --report /tmp/r.json -r requirements.txt pyinstaller
#   python3.14 scripts/write_lock.py /tmp/r.json
