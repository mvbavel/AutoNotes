name: Build AutoNotes

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64) — matches the target platform

    steps:
      - uses: actions/checkout@v7

      # Must match the local build environment: the codebase uses PEP 604
      # union syntax and several dependencies require Python >= 3.10
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # ffmpeg/ffprobe are bundled into the .app by AutoNotes.spec.
      # yt-dlp is NOT needed here — it ships as a bundled Python package.
      - name: Install Homebrew dependencies
        run: brew install ffmpeg

      # Cache the pip download cache and installed packages to speed up re-runs
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Run tests
        run: python3 -m unittest discover tests -v

      # PyInstaller caches bytecode in __pycache__; the Analysis cache lives in build/
      - name: Cache PyInstaller build
        uses: actions/cache@v6
        with:
          path: build
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('AutoNotes.spec', 'requirements.txt') }}
          restore-keys: pyinstaller-${{ runner.os }}-

      - name: Build AutoNotes.app
        run: python3 -m PyInstaller --noconfirm --log-level WARN AutoNotes.spec

      - name: Ad-hoc sign .app
        run: codesign --force --deep --sign - dist/AutoNotes.app || true

      - name: Create DMG
        run: bash make_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoNotes-dmg
          path: dist/AutoNotes.dmg
          retention-days: 14

      # Only publish a GitHub Release when a version tag is pushed (e.g. v1.2.0)
      #
      # Done with gh rather than an action because the upload needs retries: the
      # ~400 MB DMG occasionally dies mid-stream ("other side closed") when the
      # release-asset endpoint is degraded, and a one-shot upload turns a
      # transient blip into a stuck release. Publishing is deferred until the
      # asset is attached, so a failure never leaves a visible release that
      # nothing can be downloaded from. Every step is idempotent, so re-running
      # the job after a failure resumes rather than duplicating.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --generate-notes

          # gh can exit 0 without the asset landing (v1.6.4 published with no
          # DMG), so success means a fully uploaded asset of the local size.
          # Polled briefly because the release API lags a fresh upload.
          expected=$(stat -f%z dist/AutoNotes.dmg)
          dmg_attached() {
            for _ in 1 2 3 4 5 6; do
              size=$(gh release view "$TAG" --json assets --jq \
                '.assets[] | select(.name == "AutoNotes.dmg" and .state == "uploaded") | .size')
              [ "$size" = "$expected" ] && return 0
              sleep 5
            done
            echo "::warning::DMG not attached after upload (got size '${size:-none}', expected $expected)"
            return 1
          }

          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/AutoNotes.dmg --clobber && dmg_attached; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::DMG upload failed after $attempt attempts"
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::Upload attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

          gh release edit "$TAG" --draft=false
